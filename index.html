<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動題庫練習系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const questionBank = Array.from({ length: 55 }, (_, index) => {
            const id = index + 1;
            const paddedId = String(id).padStart(3, '0');
            
            let difficulty = '';
            if (id >= 1 && id <= 10) difficulty = 'yellow';
            else if (id >= 11 && id <= 20) difficulty = 'orange';
            else if (id >= 21 && id <= 30) difficulty = 'green';
            else if (id >= 31 && id <= 35) difficulty = 'blue';
            else if (id >= 36 && id <= 50) difficulty = 'purple';
            else if (id >= 51 && id <= 55) difficulty = 'red';

            return {
                id: id,
                paddedId: paddedId,
                difficulty: difficulty,
                q_url: `./images/q${paddedId}.jpg`,
                a_url: `./images/a${paddedId}.jpg`
            };
        });

        const difficultyOptions = [
            { id: 'yellow', label: '🟡 黃色 ', color: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
            { id: 'orange', label: '🟠 橙色 ', color: 'bg-orange-100 text-orange-800 border-orange-300' },
            { id: 'green', label: '🟢 綠色 ', color: 'bg-green-100 text-green-800 border-green-300' },
            { id: 'blue', label: '🔵 藍色 ', color: 'bg-blue-100 text-blue-800 border-blue-300' },
            { id: 'purple', label: '🟣 紫色 ', color: 'bg-purple-100 text-purple-800 border-purple-300' },
            { id: 'red', label: '🔴 紅色 ', color: 'bg-red-100 text-red-800 border-red-300' }
        ];

        const App = () => {
            const [step, setStep] = useState('intro');
            const [selectedDiffs, setSelectedDiffs] = useState(difficultyOptions.map(opt => opt.id));
            const [currentQ, setCurrentQ] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);
            
            const [askedHistory, setAskedHistory] = useState(() => {
                const saved = localStorage.getItem('quiz_asked_history');
                return saved ? JSON.parse(saved) : [];
            });

            const exampleQuestion = questionBank.find(q => q.id === 1);

            const toggleDiff = (diffId) => {
                if (selectedDiffs.includes(diffId)) {
                    setSelectedDiffs(selectedDiffs.filter(id => id !== diffId));
                } else {
                    setSelectedDiffs([...selectedDiffs, diffId]);
                }
            };

            const clearHistory = () => {
                if (window.confirm('確定要清除所有作答紀錄，重新開始嗎？')) {
                    setAskedHistory([]);
                    localStorage.removeItem('quiz_asked_history');
                    alert('紀錄已清除！');
                }
            };

            const pickRandomQuestion = () => {
                const pool = questionBank.filter(q => 
                    q.id !== 1 && selectedDiffs.includes(q.difficulty)
                );
                
                if (pool.length === 0) {
                    alert('請至少勾選一個難度！');
                    return;
                }

                let availablePool = pool.filter(q => !askedHistory.includes(q.id));

                if (availablePool.length === 0) {
                    alert('太棒了！您所選的難度區間題目已經全部練習完畢。系統將自動為您重新洗牌！');
                    
                    const poolIds = pool.map(q => q.id);
                    const newHistoryAfterShuffle = askedHistory.filter(id => !poolIds.includes(id));
                    
                    setAskedHistory(newHistoryAfterShuffle);
                    localStorage.setItem('quiz_asked_history', JSON.stringify(newHistoryAfterShuffle));
                    
                    availablePool = pool; 
                }

                const randomIndex = Math.floor(Math.random() * availablePool.length);
                const selectedQ = availablePool[randomIndex];

                setCurrentQ(selectedQ);
                setShowAnswer(false);
                setStep('quiz');

                const newHistory = [...askedHistory, selectedQ.id];
                setAskedHistory(newHistory);
                localStorage.setItem('quiz_asked_history', JSON.stringify(newHistory));
            };

            const currentDiffOpt = currentQ ? difficultyOptions.find(o => o.id === currentQ.difficulty) : null;

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <h1 className="text-3xl font-bold text-center text-slate-800 mb-8 mt-2">互動題庫練習系統</h1>

                    {step === 'intro' && (
                        <div className="bg-white rounded-xl shadow-lg p-5 sm:p-6 mb-6">
                            <h2 className="text-xl font-bold text-slate-700 mb-4 border-b pb-2">📖 遊戲說明與範例 (第1題)</h2>
                            
                            {exampleQuestion && (
                                <div className="mb-6 space-y-4">
                                    <div>
                                        <span className="inline-block bg-slate-100 px-3 py-1 rounded text-sm font-bold text-slate-600 mb-2">範例題目</span>
                                        <img src={exampleQuestion.q_url} alt="範例題目" className="w-full h-auto bg-slate-50 rounded border" />
                                    </div>
                                    <div>
                                        <span className="inline-block bg-yellow-100 px-3 py-1 rounded text-sm font-bold text-yellow-700 mb-2">範例解答</span>
                                        <img src={exampleQuestion.a_url} alt="範例解答" className="w-full h-auto bg-slate-50 rounded border" />
                                    </div>
                                </div>
                            )}

                            <div className="bg-slate-50 p-5 rounded-lg border">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-700">⚙️ 選擇挑戰難度 (可複選)：</h3>
                                    <span className="text-sm text-slate-500 font-medium">
                                        已作答紀錄：{askedHistory.length} / 54 題 
                                        <button onClick={clearHistory} className="ml-2 text-red-500 hover:text-red-700 underline">清除</button>
                                    </span>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6">
                                    {difficultyOptions.map(opt => {
                                        const isChecked = selectedDiffs.includes(opt.id);
                                        return (
                                            <label 
                                                key={opt.id} 
                                                className={`flex items-center p-3 rounded border cursor-pointer transition-colors ${isChecked ? opt.color : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-50'}`}
                                            >
                                                <input 
                                                    type="checkbox" 
                                                    className="w-4 h-4 mr-2 rounded text-blue-600"
                                                    checked={isChecked}
                                                    onChange={() => toggleDiff(opt.id)}
                                                />
                                                <span className="text-sm font-bold">{opt.label}</span>
                                            </label>
                                        );
                                    })}
                                </div>

                                <button 
                                    onClick={pickRandomQuestion}
                                    disabled={selectedDiffs.length === 0}
                                    className={`w-full font-bold py-3 px-4 rounded-lg transition-colors ${selectedDiffs.length > 0 ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-md' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                                >
                                    {selectedDiffs.length > 0 ? '開始挑戰！' : '請先勾選難度'}
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 'quiz' && currentQ && currentDiffOpt && (
                        <div className="bg-white rounded-xl shadow-lg p-4 sm:p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl sm:text-2xl font-bold text-slate-700 flex items-center">
                                    題目 #{currentQ.paddedId}
                                    <span className={`ml-3 text-sm px-2 py-1 rounded border ${currentDiffOpt.color}`}>
                                        {currentDiffOpt.label.split(' ')[0]}
                                    </span>
                                </h2>
                                <button 
                                    onClick={() => setStep('intro')}
                                    className="text-sm font-medium text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1 rounded-md transition"
                                >
                                    返回設定
                                </button>
                            </div>

                            <div className="mb-2">
                                <img src={currentQ.q_url} alt={`Question ${currentQ.id}`} className="w-full h-auto bg-slate-50 rounded border mb-4 shadow-sm mx-auto" />
                                
                                {!showAnswer ? (
                                    <button 
                                        onClick={() => setShowAnswer(true)}
                                        className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-4 rounded-lg shadow-md transition-colors text-lg"
                                    >
                                        👀 顯示解答
                                    </button>
                                ) : (
                                    <div className="mt-6 border-t pt-6">
                                        <h3 className="text-lg font-bold text-slate-700 mb-3">✅ 解答：</h3>
                                        <img src={currentQ.a_url} alt={`Answer ${currentQ.id}`} className="w-full h-auto bg-slate-50 rounded border border-emerald-200 mb-6 mx-auto shadow-sm" />
                                        
                                        <button 
                                            onClick={pickRandomQuestion}
                                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg shadow-md transition-colors text-lg"
                                        >
                                            🎲 下一題
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
